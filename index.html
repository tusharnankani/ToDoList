<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#062e3f">
    <meta name="Description" content="A dynamic and aesthetic To-Do List WebApp.">

    <!-- Google Font: Quick Sand -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300&display=swap" rel="stylesheet">

    <!-- font awesome (https://fontawesome.com) for basic icons; source: https://cdnjs.com/libraries/font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.0-2/css/all.min.css" integrity="sha256-46r060N2LrChLLb5zowXQ72/iKKNiw/lAmygmHExk/o=" crossorigin="anonymous" />

    <link rel="shortcut icon" type="image/png" href="assets/favicon.png"/>
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/corner.css">
    <title>JUST DO IT</title>

</head>

<body>
    <div id="header">
        <div class="flexrow-container">
            <button type="button" class="standard-theme theme-selector" data-theme="standard" aria-label="Standard theme" aria-pressed="false"></button>
            <button type="button" class="light-theme theme-selector" data-theme="light" aria-label="Light theme" aria-pressed="false"></button>
            <button type="button" class="darker-theme theme-selector" data-theme="darker" aria-label="Darker theme" aria-pressed="false"></button>
        </div>
        <h1 id="title">Just do it.<div id="border"></div></h1>
    </div>

    <div id="form">
        <form id="todo-form" novalidate>
            <div class="form-row">
                <input id="todo-input" class="todo-input" data-themed="input" data-testid="todo-input" type="text"
                       placeholder="Add a task." maxlength="200" autocomplete="off"
                       aria-label="New task" aria-describedby="form-error">
                <select id="priority-input" class="control" data-themed="input" aria-label="Priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <input id="due-input" class="control" data-themed="input" type="date" aria-label="Due date">
                <button class="todo-btn" data-themed="button" data-testid="add-btn" type="submit">I Got This!</button>
            </div>
            <p id="form-error" class="field-error" role="alert" hidden></p>
        </form>
    </div>

    <div id="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" class="filter-btn" data-themed="button" data-filter="all" data-testid="filter-all" aria-pressed="true">All</button>
            <button type="button" class="filter-btn" data-themed="button" data-filter="active" data-testid="filter-active" aria-pressed="false">Active</button>
            <button type="button" class="filter-btn" data-themed="button" data-filter="completed" data-testid="filter-completed" aria-pressed="false">Completed</button>
        </div>
        <input id="search-input" class="control" data-themed="input" data-testid="search-input" type="search"
               placeholder="Search tasks." aria-label="Search tasks" autocomplete="off">
        <button type="button" id="clear-completed" class="clear-btn" data-themed="button" data-testid="clear-completed">Clear completed</button>
    </div>

    <!-- div for top left corner -->
    <div class="version">
        <div class="demo version-section"><a href="https://github.com/madhaweshrai/ToDoList" class="github-corner" aria-label="View source on GitHub" target="_blank" rel="noopener noreferrer">
            <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; left: 0; transform: scale(-1, 1);" aria-hidden="true">
              <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
              <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
              <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
            </svg></a>
        </div>
    </div>

    <div>
        <p><span id="datetime"></span></p>
    </div>

    <p id="status-message" class="status-message" role="status" hidden></p>

    <div id="myUnOrdList">
        <ul class="todo-list" id="todo-list" aria-label="Tasks"></ul>
    </div>

    <script src="JS/time.js"></script>
    <script src="JS/main.js"></script>
</body>
</html>
